name: Sync backblasts from Slack

# Backblasts routinely land 4-6 days after the workout, so this runs daily and
# looks 21 days back rather than trying to catch each post the morning after.
# It never writes to main: new drafts land on a long-lived review branch and a
# person merges them, because canonical PAX naming, unseen nicknames and the
# rule that an FNG stays "FNG" until they earn an F3 name all need judgment.
on:
  schedule:
    - cron: '0 13 * * *'   # 08:00 CT (CDT) / 07:00 CT (CST)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'How many days back to search'
        default: '21'
      dry_run:
        description: 'Report only, write nothing'
        type: boolean
        default: false

concurrency:
  group: slack-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: auto/backblast-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      # A parser regression would write bad drafts, so gate the import on the
      # golden tests that replay three months of real backblasts.
      - name: Run importer tests
        run: uv run --with pytest pytest tests/ -q

      # Work on top of the review branch when it already exists, so drafts a
      # person has been curating there are never force-pushed away. The branch
      # is brought up to date with main first.
      - name: Prepare the review branch
        run: |
          set -euo pipefail
          git config user.name  "f3-site bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -B "$BRANCH" origin/main
          fi

      - name: Sync from Slack
        env:
          slack_token: ${{ secrets.SLACK_TOKEN }}
        run: |
          uv run scripts/daily_slack_sync.py \
            --lookback-days "${{ inputs.lookback_days || '21' }}" \
            --report "$RUNNER_TEMP/sync-report.md" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit, push, and open or update the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/sync-report.md"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$(git status --porcelain content/)" ]; then
            echo "No content changes; nothing to push."
            exit 0
          fi

          git add content/backblasts content/data.json
          printf '%s\n\n%s\n' \
            'Auto: import new backblasts from Slack' \
            'Generated by .github/workflows/slack-sync.yml. Check the PAX names, titles and bodies before merging; anything the importer was unsure about is listed in the PR body.' \
            | git commit -F -
          git push origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file "$REPORT"
            echo "Updated the existing review PR."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Auto: new backblasts from Slack" \
              --body-file "$REPORT" \
              --label needs-curation
          fi
