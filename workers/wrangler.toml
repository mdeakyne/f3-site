name = "f3-q-publisher"
main = "q-publisher.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Both UTC hours are needed; runScheduled gates to 10:00 America/Chicago.
[triggers]
crons = ["0 15,16 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "f3-signups"
database_id = "b7ac38a1-b139-4f60-a9c8-3dbb99230b17"
migrations_dir = "../migrations"

# Configure Q_SLACK_WEBHOOKS_JSON as a Worker secret: server-only JSON mapping
# AO slugs to their channel's incoming webhook URL. Optional
# Q_SLACK_MEMBERS_JSON maps stable PAX slugs to Slack member IDs.
