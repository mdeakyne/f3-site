name = "f3-site"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# D1 for Q signups. Create with:
#   wrangler d1 create f3-signups
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "f3-signups"
database_id = "b7ac38a1-b139-4f60-a9c8-3dbb99230b17"
migrations_dir = "migrations"

# Pages secrets (never committed):
#   wrangler pages secret put TURNSTILE_SECRET_KEY --project-name f3-site
#   wrangler pages secret put SLACK_BOT_TOKEN --project-name f3-site
# Optional server-only Q_SLACK_MEMBERS_JSON is also configured on Pages.
# The contact form separately retains SLACK_WEBHOOK_URL.
# Configure the same SLACK_BOT_TOKEN and optional member map on the cron Worker;
# workers/wrangler.toml binds this same D1 database. See docs/q-signup-deployment.md.
